name: Public workspace check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run offline public gate regression tests
        run: python3 -m unittest discover -s tests -p 'test_public_source_gate.py' -v
      - name: Verify public-only repository contents
        run: |
          python3 - <<'PY'
          from pathlib import Path
          prohibited={'.pdf','.apk','.aab','.jks','.p12','.pem'}
          files=[f for f in Path('.').rglob('*') if f.is_file() and '.git' not in f.parts]
          unexpected=[str(f) for f in files if f.suffix.lower() in prohibited]
          assert not unexpected, 'Private artifacts in public repository: '+str(unexpected)
          print('Public file-type safety check passed. Android app build not yet configured.')
          PY
